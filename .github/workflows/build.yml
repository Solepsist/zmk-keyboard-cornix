name: Build ZMK firmware
on:
  workflow_dispatch:
  push:
    paths:
      - "boards/*"
      - "config/*"

jobs:
  build:
    # Pin to same major release as config/west.yml zmk revision (v0.3.x). @main expects newer
    # west boards output (`qualifiers`) and breaks KeyError with Zephyr 3.5 toolchains.
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@v0.3.0
