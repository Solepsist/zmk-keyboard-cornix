name: Build ZMK firmware
on:
  workflow_dispatch:
  push:
    paths:
      - "boards/**"
      - "config/**"
      - "build.yaml"

jobs:
  build:
    # Immutable SHA for tag v0.3.0 — avoids accidentally tracking a retagged ref or stale @main behavior.
    # Must match config/west.yml zmk revision. Newer reusable workflows use `west boards --format {qualifiers}`
    # which breaks older Zephyr/west (KeyError: 'qualifiers').
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@edf5c0814fd3ea202e43aad2d68fd32e882a518c
